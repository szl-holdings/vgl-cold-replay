name: Offline receipt preservation contract

on:
  pull_request:
    paths:
      - "vgl_cold_replay/replay.py"
      - "tests/test_receipt_preservation.py"
      - ".github/workflows/offline-receipt-contract.yml"
  push:
    branches: [main]
    paths:
      - "vgl_cold_replay/replay.py"
      - "tests/test_receipt_preservation.py"
      - ".github/workflows/offline-receipt-contract.yml"

permissions:
  contents: read

jobs:
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pure synthetic receipts — no network, data or signing authority
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -B -m unittest discover -s tests -p 'test_receipt_preservation.py' -v
